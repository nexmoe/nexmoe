<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Nexmoe open-source overview</title>
<desc id="overview-desc">29,910 stars, 623 followers, 2,955 forks, 16,266 commits across 64 repositories</desc>
<defs>
  <clipPath id="activity"><rect x="0" y="0" width="380" height="12" rx="6"/></clipPath>
  <clipPath id="sources"><rect x="0" y="0" width="380" height="12" rx="6"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
  .hero{font-size:80px;font-weight:800;letter-spacing:-3.5px;fill:#1d1d1f}
  .large{font-size:40px;font-weight:700;letter-spacing:-1.5px;fill:#1d1d1f}
  .metric{font-size:24px;font-weight:600;letter-spacing:-0.8px;fill:#1d1d1f}
  .section{font-size:15px;font-weight:600;fill:#1d1d1f}
  .label{font-size:11px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;fill:#8e8e93}
  .body{font-size:13px;font-weight:500;fill:#3c3c43}
  .value{font-size:12px;font-weight:500;fill:#8e8e93}
  .caption{font-size:11px;font-weight:400;fill:#aeaeb2}
  .track{fill:#f0f0f5}
  .commits{fill:#007aff}
  .prs{fill:#34c759}
  .issues{fill:#ff9500}
  .owned{fill:#5856d6}
  .collab{fill:#af52de}
  .orgs{fill:#ff2d55}
  @media (prefers-color-scheme:dark){
    .hero,.large,.metric,.section,.body{fill:#f5f5f7}
    .label,.value{fill:#98989d}
    .caption{fill:#636366}
    .track{fill:#2c2c2e}
  }
</style>

<!-- Main metric -->
<text class="hero" x="0" y="70">29,910</text>
<text class="label" x="0" y="90">Total Stars · 64 Repositories</text>

<!-- Key metrics grid -->
<g transform="translate(0, 140)">
  <text class="large" x="0" y="0">623</text>
  <text class="label" x="0" y="18">Followers</text>
</g>
<g transform="translate(200, 140)">
  <text class="large" x="0" y="0">2,955</text>
  <text class="label" x="0" y="18">Forks</text>
</g>
<g transform="translate(420, 140)">
  <text class="large" x="0" y="0">114</text>
  <text class="label" x="0" y="18">Contributed To</text>
</g>
<g transform="translate(640, 140)">
  <text class="large" x="0" y="0">16,266</text>
  <text class="label" x="0" y="18">Commits</text>
</g>

<!-- Activity breakdown -->
<g transform="translate(0, 240)">
  <text class="section" x="0" y="0">Activity Distribution</text>
  <g transform="translate(0, 20)">
    <rect class="track" width="380" height="12" rx="6"/>
    <g clip-path="url(#activity)">
      <rect class="commits" x="0" y="0" width="364.36" height="12"/>
      <rect class="prs" x="364.36" y="0" width="6.83" height="12"/>
      <rect class="issues" x="371.20" y="0" width="8.80" height="12"/>
    </g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="commits" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Commits</text>
    <text class="value" x="240" y="4">16,266 · 95.9%</text>
  </g>
  <g transform="translate(0, 72)">
    <circle class="prs" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Pull requests</text>
    <text class="value" x="240" y="4">305 · 1.8%</text>
  </g>
  <g transform="translate(0, 96)">
    <circle class="issues" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Issues</text>
    <text class="value" x="240" y="4">393 · 2.3%</text>
  </g>
</g>

<!-- Star sources -->
<g transform="translate(460, 240)">
  <text class="section" x="0" y="0">Star Sources</text>
  <g transform="translate(0, 20)">
    <rect class="track" width="380" height="12" rx="6"/>
    <g clip-path="url(#sources)">
      <rect class="owned" x="0.00" y="0" width="146.35" height="12"/><rect class="collab" x="146.35" y="0" width="233.65" height="12"/><rect class="orgs" x="380.00" y="0" width="0.00" height="12"/>
    </g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="owned" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Owned repositories</text>
    <text class="value" x="240" y="4">11,519 · 38.5%</text>
  </g>
  <g transform="translate(0, 72)">
    <circle class="collab" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Member / collaborator</text>
    <text class="value" x="240" y="4">18,391 · 61.5%</text>
  </g>
  <g transform="translate(0, 96)">
    <circle class="orgs" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">Organizations</text>
    <text class="value" x="240" y="4">0 · 0.0%</text>
  </g>
</g>

<!-- Top organizations -->
<g transform="translate(0, 400)">
  <text class="section" x="0" y="0">Top Organizations</text>
  
</g>

<!-- Footer -->
<text class="caption" x="0" y="480">14 Aug 2026 · 15:19 UTC+8</text>
</svg>