<svg xmlns="http://www.w3.org/2000/svg" lang="en" width="840" height="264" viewBox="0 0 840 264" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Nexmoe open-source overview</title>
<desc id="overview-desc">37,439 stars, 658 followers, 4,408 forks, 18,768 commits across 143 repositories</desc>
<defs><clipPath id="bar"><rect width="400" height="8" rx="4"/></clipPath></defs>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;fill:#171717}
  .hero{font-size:80px;font-weight:800;letter-spacing:-3px;fill:#171717}
  .stat{font-size:24px;font-weight:700;letter-spacing:-0.5px}
  .title{font-size:15px;font-weight:600}
  .label{font-size:13px;fill:#737373}
  .body{font-size:14px}
  .value{font-size:14px;fill:#737373}
  .track{fill:#f5f5f5}
  .tone0{fill:#171717}
  .tone1{fill:#737373}
  .tone2{fill:#d4d4d4}
  @media(prefers-color-scheme:dark){
    text{fill:#fafafa}
    .hero,.tone0{fill:#fafafa}
    .label,.value,.tone1{fill:#a3a3a3}
    .track{fill:#262626}
    .tone2{fill:#525252}
  }
</style>

<!-- Stars on the left; four supporting metrics in a 2 × 2 grid on the right -->
<text class="hero" x="0" y="68">37,439</text>
<text class="label" x="0" y="100">Total stars · 143 repositories</text>
<text class="stat" x="440" y="29">658</text>
<text class="label" x="440" y="47">Followers</text>
<text class="stat" x="640" y="29">4,408</text>
<text class="label" x="640" y="47">Forks</text>
<text class="stat" x="440" y="82">124</text>
<text class="label" x="440" y="100">Contributed to</text>
<text class="stat" x="640" y="82">18,768</text>
<text class="label" x="640" y="100">Commits</text>

<!-- Star sources sit under the stars, contributions under the activity metrics -->
<g transform="translate(0, 148)">
  <text class="title" x="0" y="0">Star sources</text>
  <g transform="translate(0, 14)">
    <rect class="track" width="400" height="8" rx="4"/>
    <g clip-path="url(#bar)"><rect class="tone0" x="0.00" y="0" width="133.69" height="8"/><rect class="tone1" x="133.69" y="0" width="206.44" height="8"/><rect class="tone2" x="340.13" y="0" width="59.87" height="8"/></g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="tone0" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Owned repositories</text>
    <text class="body" text-anchor="end" x="330" y="0">12,513</text>
    <text class="value" text-anchor="end" x="400" y="0">33.4%</text>
  </g>
  <g transform="translate(0, 74)">
    <circle class="tone1" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Member / collaborator</text>
    <text class="body" text-anchor="end" x="330" y="0">19,322</text>
    <text class="value" text-anchor="end" x="400" y="0">51.6%</text>
  </g>
  <g transform="translate(0, 100)">
    <circle class="tone2" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Organizations</text>
    <text class="body" text-anchor="end" x="330" y="0">5,604</text>
    <text class="value" text-anchor="end" x="400" y="0">15.0%</text>
  </g>
</g>
<g transform="translate(440, 148)">
  <text class="title" x="0" y="0">Contributions</text>
  <g transform="translate(0, 14)">
    <rect class="track" width="400" height="8" rx="4"/>
    <g clip-path="url(#bar)"><rect class="tone0" x="0.00" y="0" width="383.57" height="8"/><rect class="tone1" x="383.57" y="0" width="8.07" height="8"/><rect class="tone2" x="391.64" y="0" width="8.36" height="8"/></g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="tone0" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Commits</text>
    <text class="body" text-anchor="end" x="330" y="0">18,768</text>
    <text class="value" text-anchor="end" x="400" y="0">95.9%</text>
  </g>
  <g transform="translate(0, 74)">
    <circle class="tone1" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Pull requests</text>
    <text class="body" text-anchor="end" x="330" y="0">395</text>
    <text class="value" text-anchor="end" x="400" y="0">2.0%</text>
  </g>
  <g transform="translate(0, 100)">
    <circle class="tone2" cx="4" cy="-5" r="4"/>
    <text class="body" x="16" y="0">Issues</text>
    <text class="body" text-anchor="end" x="330" y="0">409</text>
    <text class="value" text-anchor="end" x="400" y="0">2.1%</text>
  </g>
</g>
</svg>