<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Nexmoe 开源概览</title>
<desc id="overview-desc">37,245 个 Star，653 位关注者，4,382 次复刻，142 个仓库，共 18,356 次提交</desc>
<defs>
  <clipPath id="activity"><rect x="0" y="0" width="380" height="12" rx="6"/></clipPath>
  <clipPath id="sources"><rect x="0" y="0" width="380" height="12" rx="6"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
  .hero{font-size:80px;font-weight:800;letter-spacing:-3.5px;fill:#1d1d1f}
  .large{font-size:40px;font-weight:700;letter-spacing:-1.5px;fill:#1d1d1f}
  .metric{font-size:24px;font-weight:600;letter-spacing:-0.8px;fill:#1d1d1f}
  .section{font-size:15px;font-weight:600;fill:#1d1d1f}
  .label{font-size:11px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;fill:#8e8e93}
  .body{font-size:13px;font-weight:500;fill:#3c3c43}
  .value{font-size:12px;font-weight:500;fill:#8e8e93}
  .track{fill:#f0f0f5}
  .commits{fill:#007aff}
  .prs{fill:#34c759}
  .issues{fill:#ff9500}
  .owned{fill:#5856d6}
  .collab{fill:#af52de}
  .orgs{fill:#ff2d55}
  @media (prefers-color-scheme:dark){
    .hero,.large,.metric,.section,.body{fill:#f5f5f7}
    .label,.value{fill:#98989d}
    .track{fill:#2c2c2e}
  }
</style>

<!-- Main metric -->
<text class="hero" x="0" y="70">37,245</text>
<text class="label" x="0" y="90">Star 总数 · 142 个仓库</text>

<!-- Key metrics grid -->
<g transform="translate(0, 140)">
  <text class="large" x="0" y="0">653</text>
  <text class="label" x="0" y="18">关注者</text>
</g>
<g transform="translate(200, 140)">
  <text class="large" x="0" y="0">4,382</text>
  <text class="label" x="0" y="18">复刻</text>
</g>
<g transform="translate(420, 140)">
  <text class="large" x="0" y="0">122</text>
  <text class="label" x="0" y="18">参与项目</text>
</g>
<g transform="translate(640, 140)">
  <text class="large" x="0" y="0">18,356</text>
  <text class="label" x="0" y="18">提交</text>
</g>

<!-- Activity breakdown -->
<g transform="translate(0, 240)">
  <text class="section" x="0" y="0">贡献分布</text>
  <g transform="translate(0, 20)">
    <rect class="track" width="380" height="12" rx="6"/>
    <g clip-path="url(#activity)">
      <rect class="commits" x="0" y="0" width="364.30" height="12"/>
      <rect class="prs" x="364.30" y="0" width="7.60" height="12"/>
      <rect class="issues" x="371.90" y="0" width="8.10" height="12"/>
    </g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="commits" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">提交</text>
    <text class="value" x="240" y="4">18,356 · 95.9%</text>
  </g>
  <g transform="translate(0, 72)">
    <circle class="prs" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">拉取请求</text>
    <text class="value" x="240" y="4">383 · 2.0%</text>
  </g>
  <g transform="translate(0, 96)">
    <circle class="issues" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">议题</text>
    <text class="value" x="240" y="4">408 · 2.1%</text>
  </g>
</g>

<!-- Star sources -->
<g transform="translate(460, 240)">
  <text class="section" x="0" y="0">Star 来源</text>
  <g transform="translate(0, 20)">
    <rect class="track" width="380" height="12" rx="6"/>
    <g clip-path="url(#sources)">
      <rect class="owned" x="0.00" y="0" width="126.80" height="12"/><rect class="collab" x="126.80" y="0" width="195.95" height="12"/><rect class="orgs" x="322.75" y="0" width="57.25" height="12"/>
    </g>
  </g>
  <g transform="translate(0, 48)">
    <circle class="owned" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">个人仓库</text>
    <text class="value" x="240" y="4">12,428 · 33.4%</text>
  </g>
  <g transform="translate(0, 72)">
    <circle class="collab" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">成员 / 协作仓库</text>
    <text class="value" x="240" y="4">19,206 · 51.6%</text>
  </g>
  <g transform="translate(0, 96)">
    <circle class="orgs" cx="6" cy="0" r="4"/>
    <text class="body" x="18" y="4">组织仓库</text>
    <text class="value" x="240" y="4">5,611 · 15.1%</text>
  </g>
</g>

</svg>